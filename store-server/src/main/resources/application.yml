server:
  port: 8084

spring:
  application:
    name: store-server

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # 응답 시간 p95·p99 계산용
