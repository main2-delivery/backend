services:
  mysql:
    image: mysql:8.4
    container_name: dishpatch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-dishpatch}
      MYSQL_USER: ${DB_USER:-dishpatch}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dishpatch}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: dishpatch-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  mysql-data:
