plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.main2.delivery'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(17) }
    }

    repositories { mavenCentral() }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-amqp-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
        testImplementation 'org.springframework.boot:spring-boot-testcontainers'
        testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
        testImplementation 'org.testcontainers:testcontainers-mysql'
        testImplementation 'org.testcontainers:testcontainers-rabbitmq'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') { useJUnitPlatform() }

    // 메서드 파라미터 이름을 컴파일 결과에 남김 (@RequestParam, @PathVariable 이름 연결용)
    // -server 모듈은 Boot 플러그인이 자동으로 켜 주지만, common·core-domain은 직접 켜야 함
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
    }
}

// 이름이 -server로 끝나는 모듈 = 실행되는 서버
configure(subprojects.findAll { it.name.endsWith('-server') }) {
    apply plugin: 'org.springframework.boot'

    dependencies {
        implementation project(':common')
        runtimeOnly 'com.mysql:mysql-connector-j'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'   // Prometheus 수치 내보내기
    }
}