server:
  port: 8082

spring:
  application:
    name: owner-server
  # backend/.env 를 읽음 (bootRun 은 모듈 폴더에서 실행되므로 ../.env 도 함께 지정)
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  # 이미지 업로드 크기 제한 (ImageService.MAX_BYTES 와 같은 값). 넘으면 400 IMAGE_TOO_LARGE
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ddip}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:ddip}
    password: ${DB_PASSWORD:ddip}
  flyway: # ← 추가
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true # 테이블은 있는데 Flyway 기록이 없으면 기준점(baseline)을 찍음
    baseline-version: 0 # 그 기준점을 V0로 → V0는 실행하지 않고 "적용됨"으로 기록
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

internal:
  api-key: ${INTERNAL_API_KEY:local-internal-key}
  customer-base-url: ${CUSTOMER_BASE_URL:http://localhost:8081}

# 이미지 업로드 (DUDU-18). 로컬 폴더에 저장하고 업주 서버가 /images/** 로 내보낸다
app:
  image:
    upload-dir: ${IMAGE_UPLOAD_DIR:uploads/images}         # 상대 경로면 서버 실행 위치 기준
    base-url: ${IMAGE_BASE_URL:http://localhost:8082}      # 응답 imageUrl 앞부분. 배포 시 외부에서 열리는 주소로

# 주소 → 좌표 변환 (common GeoCodingService). 키는 .env 의 KAKAO_REST_API_KEY, 없으면 변환 실패로 처리
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true # 응답 시간 p95·p99 계산용
ddip:
  auth:
    dev-header:
      enabled: true   # Security 적용 전 개발용 테스트 헤더 인증. DUDU-32(JWT) 적용 시 false