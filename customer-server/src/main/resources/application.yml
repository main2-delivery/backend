server:
  port: 8081

spring:
  application:
    name: customer-server
  # backend/.env 를 읽음 (bootRun 은 모듈 폴더에서 실행되므로 ../.env 도 함께 지정)
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ddip}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:ddip}
    password: ${DB_PASSWORD:ddip}
  flyway:                          # ← 추가
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true      # 테이블은 있는데 Flyway 기록이 없으면 기준점(baseline)을 찍음
    baseline-version: 0            # 그 기준점을 V0로 → V0는 실행하지 않고 "적용됨"으로 기록
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

internal:
  api-key: ${INTERNAL_API_KEY:local-internal-key}
  owner-base-url: ${OWNER_BASE_URL:http://localhost:8082}

# 주소 → 좌표 변환 (common GeoCodingService). 키는 .env 의 KAKAO_REST_API_KEY, 없으면 변환 실패로 처리
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # 응답 시간 p95·p99 계산용
