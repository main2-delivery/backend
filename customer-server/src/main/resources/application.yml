server:
  port: 8081

spring:
  application:
    name: customer-server
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ddip}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:ddip}
    password: ${DB_PASSWORD:ddip}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

internal:
  api-key: ${INTERNAL_API_KEY:local-internal-key}
  owner-base-url: ${OWNER_BASE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # 응답 시간 p95·p99 계산용
